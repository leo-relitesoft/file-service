name: ${COMPOSE_PROJECT_NAME:-files}

services:
  fastapi:
    container_name: ${CONTAINER_NAME:-files}
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "80:80"
    networks:
      - internal
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8111:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cloud:/app/cloud
    depends_on:
      - fastapi
    networks:
      internal:

  cron:
    build: cron
    restart: "no"
    depends_on:
      - fastapi
    networks:
      internal:

networks:
  internal:
    driver: bridge