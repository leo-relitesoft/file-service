[project]
name = "files"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "leo", email = "leo.relitesoft@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=3.9.2",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.1",
]

[project.scripts]
