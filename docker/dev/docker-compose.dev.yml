services:
  fastapi:
    environment:
      UV_NO_SYNC: "1"
      UV_OFFLINE: "1"
    env_file: !reset []
    command:
      - /bin/sh
      - -ec
      - |
        exec uv run fastapi dev src/files/main.py --host 0.0.0.0 --port 8000
    volumes:
      - ./.env:/app/.env:ro
      - ../../src:/app/src:ro
      - ../../alembic:/app/alembic:ro
#      - ./web:/app/web
    networks:
      internal:


