name: ${COMPOSE_PROJECT_NAME:-file-service-py}

services:
  fastapi:
    container_name: ${CONTAINER_NAME:-file-service-py}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      APP_PORT: ${APP_PORT:-80}
      TLS_ENABLED: ${TLS_ENABLED:-true}
    ports:
      - "${HTTPS_PORT:-8171}:${APP_PORT:-8000}"
    networks:
      - internal
